<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobXp - Busca experiencias</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="main.html" class="logo-link">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </a>
        <a href="perfil.html">
            <img src="../images/default-avatar-photo-icon-social-media.png" alt="Perfil" class="avatar-icon">
        </a>
    </header>

    <main class="main-container">
        <div class="form-card" style="max-width: 760px;">
            <h2 class="page-title" style="align-self: flex-start;">Busca experiencias</h2>
            <div class="form-group">
                <label>buscar</label>
                <input type="text" class="form-input">
            </div>

            <div class="card-wrapper" style="margin-top: 10px;">
                <a href="programador.html" class="job-card">
                    <img src="../images/programador.png" alt="programador">
                    <h3>programador</h3>
                    <p>puesto de programador junior</p>
                </a>

                <a href="aydante.html" class="job-card">
                    <img src="../images/taller.jfif" alt="ayudante taller">
                    <h3>ayudante taller</h3>
                    <p>ayudante en taller mecanico</p>
                </a>
            </div>

            <a href="main.html" class="btn-secondary" style="max-width: 240px; margin-top: 24px;">volver al inicio</a>
        </div>
    </main>

    <footer>
        <div class="logo-link" style="font-size: 22px;">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </div>
        <span>todos los derechos reservados. <br> JobXP</span>
    </footer>
</body>
</html>
