<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobXp - Perfil</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="main.html" class="logo-link">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </a>
        <a href="perfil.html">
            <img src="../images/default-avatar-photo-icon-social-media.png" alt="Perfil" class="avatar-icon">
        </a>
    </header>

    <main class="main-container">
        <div class="form-card">
            <h2 class="page-title" style="font-size: 32px; margin-bottom: 24px;">Perfil</h2>

            <form action="#" style="width: 100%;">
                <div class="form-group">
                    <label>Nombre:</label>
                    <div class="input-with-icon">
                        <input type="text" class="form-input" value="Ariel Fraundez">
                        <span class="edit-icon">✏️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Correo Electronico:</label>
                    <div class="input-with-icon">
                        <input type="email" class="form-input" value="arielfaundez@gmail.com">
                        <span class="edit-icon">✏️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Especialidad:</label>
                    <div class="input-with-icon">
                        <input type="text" class="form-input" value="Programador front-end">
                        <span class="edit-icon">✏️</span>
                    </div>
                </div>

                <a href="main.html" class="btn-primary">Guardar cambios</a>
                <a href="main.html" class="btn-secondary">volver al inicio</a>
            </form>
        </div>
    </main>

    <footer>
        <div class="logo-link" style="font-size: 22px;">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </div>
        <span>todos los derechos reservados. <br> JobXP</span>
    </footer>
</body>
</html>
