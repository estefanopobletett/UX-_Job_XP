<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobXp - Crear cuenta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../../index.html" class="logo-link">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </a>
        <a href="perfil.html">
            <img src="../images/default-avatar-photo-icon-social-media.png" alt="Perfil" class="avatar-icon">
        </a>
    </header>

    <main class="main-container">
        <div class="form-card">
            <div class="big-logo">
                <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
            </div>
            <p class="subtitle">Crear cuenta</p>

            <form action="#" style="width: 100%;">
                <div class="form-group">
                    <label>Correo electronico</label>
                    <input type="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" class="form-input" required>
                </div>
                <a href="main.html" class="btn-primary">Crear cuenta</a>
            </form>
        </div>
    </main>

    <footer>
        <div class="logo-link" style="font-size: 22px;">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </div>
        <span>todos los derechos reservados. <br> JobXP</span>
    </footer>
</body>
</html>
