<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobXp - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <div class="contenedor-principal">

        <header class="barra-navegacion">
            <div class="logo logo-navegacion">Job<span class="morado">Xp</span></div>
            <div class="icono-usuario">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </header>

        <main class="contenido-principal">
            <div class="parte-superior">
                <h1 class="logo logo-principal">Job<span class="morado">Xp</span></h1>
                <p class="subtitulo">Registrate</p>
            </div>

            <form class="formulario" action="">
                <div class="grupo-entrada">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required>
                </div>

                <div class="grupo-entrada">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                                <div class="grupo-entrada">
                    <label for="password">Confirmar Contraseña</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="boton-principal">Crear cuenta</button>
            </form>

            <p class="texto-registro">
                ¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>
            </p>
        </main>

        <footer class="pie-pagina">
            <span class="logo logo-pie">Job<span class="morado">Xp</span></span>
            <span class="derechos-autor">todos los derechos<br>reservados. JobXp</span>
        </footer>

    </div>

</body>

</html>
