<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobXp - Inicio sesión</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </a>
        <a href="static/pages/perfil.html">
            <img src="static/images/default-avatar-photo-icon-social-media.png" alt="Perfil" class="avatar-icon">
        </a>
    </header>

    <main class="main-container">
        <div class="form-card">
            <div class="big-logo">
                <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
            </div>
            <p class="subtitle">Inicia sesión</p>

            <form action="#" style="width: 100%;">
                <div class="form-group">
                    <label>Correo electronico</label>
                    <input type="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" class="form-input" required>
                </div>
                <a href="static/pages/main.html" class="btn-primary">Iniciar sesión</a>
            </form>

            <p class="form-footer-link">No tienes cuenta? <a href="static/pages/register.html">Registrate aquí</a></p>
        </div>
    </main>

    <footer>
        <div class="logo-link" style="font-size: 22px;">
            <span class="logo-job">Job</span><span class="logo-xp">Xp</span>
        </div>
        <span>todos los derechos reservados. <br> JobXP</span>
    </footer>
</body>
</html>
