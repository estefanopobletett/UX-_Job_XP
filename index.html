<!DOCTYPE html>
<html lang="en">

<head>

    <title>JobXP</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <h1 class="logo">Job<span class="morado">Xp</span></h1>
            <img src="static/images/default-avatar-photo-icon-social-media-profile-sign-symbol-vector.jpg" alt="perfil" class="perfil">
        </nav>
    </header>
    <main class="container">
        <div class="parte superior">
            <h1 class="logo">Job<span class="morado">Xp</span></h1>
            <p class="parrafo">Inicia sesión</p>
        </div>
        <div class="form">
            <form action="">
                <div class="input">
                    <p>Correo electronico:</p>
                    <input type="email">
                </div>
                <div class="input">
                    <p>Contraseña:</p>
                    <input type="password">
                </div>
                <button type="submit">Iniciar sesión</button>
            </form>
            <p>No tienes cuenta? <a href="">Registrate aquí</a></p>
        </div>
    </main>
    <footer>
        <h1 class="logo">Job<span class="morado">Xp</span></h1>
        <p>Todos los derechos <br> reservados.JobXP</p>
    </footer>
